version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-hook-form"
          - "react-day-picker"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "@types/node"
      ui-utilities:
        patterns:
          - "class-variance-authority"
          - "clsx"
          - "tailwind-merge"
          - "tailwindcss-animate"
          - "tailwindcss"
          - "postcss"
          - "embla-carousel-react"
          - "lucide-react"
          - "recharts"
      typescript-tooling:
        patterns:
          - "typescript"
          - "tsx"
          - "zod"
      dev-tools:
        patterns:
          - "@anthropic-ai/*"
